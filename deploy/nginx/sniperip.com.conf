# Host nginx server block for the SniperIP app at the root domain sniperip.com.
#
# This sits in front of the Docker stack's Caddy container, which binds
# 127.0.0.1:21080 (see CADDY_BIND in docker-compose.prod.yml). Caddy then
# routes /api/* -> FastAPI (api:8000) and everything else -> Next.js (web:3000).
#
# Install on the host:
#   sudo cp deploy/nginx/sniperip.com.conf /etc/nginx/sites-available/sniperip.com.conf
#   sudo ln -sf /etc/nginx/sites-available/sniperip.com.conf /etc/nginx/sites-enabled/sniperip.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is terminated here using the existing origin cert; the public edge is
# Cloudflare. The /amzreclaim and /dashboard prefixes are reserved for other
# local apps and are matched before the catch-all proxy to the SniperIP stack.

server {
  listen 80;
  listen [::]:80;
  server_name sniperip.com www.sniperip.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sniperip.com www.sniperip.com;

  ssl_certificate /etc/nginx/ssl-certificates/sniperip.com.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/sniperip.com.key;

  access_log off;
  error_log /var/log/nginx/sniperip.com-error.log;

  # Allow large asset/evidence uploads through to the API.
  client_max_body_size 50m;

  # --- Reserved for other local apps (matched before the app catch-all) ---
  location ^~ /amzreclaim {
    proxy_pass http://127.0.0.1:3067;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 900;
    proxy_send_timeout 900;
    proxy_buffering off;
  }

  location = /dashboard { return 301 /dashboard/; }
  location /dashboard/ {
    proxy_pass http://127.0.0.1:4040/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

  # --- SniperIP app (Next.js + FastAPI behind the stack's Caddy) ---
  location / {
    proxy_pass http://127.0.0.1:21080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 120;
    proxy_send_timeout 120;
  }
}
